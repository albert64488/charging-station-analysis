name: collect

on:
  schedule:
    # poll(10분)은 cron-job.org가 안정적으로 트리거함. 여기선 refresh만 백업 스케줄로.
    - cron: "30 */6 * * *"   # 하루 4회 전수 refresh (자기보정)
  workflow_dispatch:          # 수동 실행(시드용). mode 입력 선택
    inputs:
      mode:
        description: "refresh | poll"
        type: choice
        default: refresh
        options: [refresh, poll]

# 동시 실행 방지(앞 작업이 끝날 때까지 대기)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-collect.txt

      - name: 모드 결정
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 */6 * * *" ]; then
            echo "mode=refresh" >> "$GITHUB_OUTPUT"
          else
            echo "mode=poll" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집 실행 (${{ steps.m.outputs.mode }})
        env:
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python run_collect.py ${{ steps.m.outputs.mode }} --nationwide
